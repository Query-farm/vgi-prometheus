# Live fixture: Prometheus scraping itself, plus the backfilled fixture blocks
# (test/fixture/data.om) and a rules file so rules/alerts are non-empty.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    fixture: vgi-prometheus
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.invalid:9093"]
scrape_configs:
  - job_name: prometheus
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          team: observability
  - job_name: unreachable
    static_configs:
      - targets: ["unreachable.invalid:9100"]
